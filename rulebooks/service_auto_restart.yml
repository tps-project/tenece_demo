---
- name: Self-healing — auto-restart failed services
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
        token: "{{ eda_webhook_token }}"

  rules:
    - name: Restart service on failure event
      condition: event.payload.failed_unit is defined
      throttle:
        once_within: 300
        group_by_attributes:
          - event.payload.hostname
          - event.payload.failed_unit
      action:
        run_job_template:
          name: "Restart Failed Service"
          organization: "Default"
          job_args:
            extra_vars:
              target_service: "{{ event.payload.failed_unit }}"
              target_host: "{{ event.payload.hostname }}"
              failure_timestamp: "{{ event.payload.timestamp }}"

    - name: Log every raw failure event for audit trail
      condition: event.payload.failed_unit is defined
      action:
        debug:
          msg: >
            Failure event received: {{ event.payload.failed_unit }}
            on {{ event.payload.hostname }} at {{ event.payload.timestamp }}
