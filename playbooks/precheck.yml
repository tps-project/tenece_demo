---
- name: Linux Patch Management - Pre-Checks
  hosts: web
  become: true
  gather_facts: true

  vars:
    root_threshold: 90
    var_threshold: 90
    boot_threshold: 80

  tasks:

    # ---------------------------------------------------------
    # 1. Basic Server Information
    # ---------------------------------------------------------

    - name: Display server information
      ansible.builtin.debug:
        msg:
          - "Hostname: {{ ansible_hostname }}"
          - "IP Address: {{ ansible_default_ipv4.address | default('N/A') }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Kernel: {{ ansible_kernel }}"
          - "Uptime: {{ (ansible_uptime_seconds / 86400) | round(1) }} days"


    # ---------------------------------------------------------
    # 2. Check Operating System
    # ---------------------------------------------------------

    - name: Validate operating system
      ansible.builtin.set_fact:
        os_check_passed: "{{ ansible_distribution == 'RedHat' }}"

    - name: Display OS check
      ansible.builtin.debug:
        msg: >-
          OS Check:
          {{ 'PASS' if os_check_passed else 'FAIL' }}


    # ---------------------------------------------------------
    # 3. Filesystem Checks
    # ---------------------------------------------------------

    - name: Get root filesystem usage
      ansible.builtin.shell: |
        df -P / | awk 'NR==2 {gsub("%","",$5); print $5}'
      register: root_usage
      changed_when: false

    - name: Get /var filesystem usage
      ansible.builtin.shell: |
        df -P /var | awk 'NR==2 {gsub("%","",$5); print $5}'
      register: var_usage
      changed_when: false

    - name: Get /boot filesystem usage
      ansible.builtin.shell: |
        df -P /boot | awk 'NR==2 {gsub("%","",$5); print $5}'
      register: boot_usage
      changed_when: false


    # ---------------------------------------------------------
    # 4. Evaluate Filesystem Thresholds
    # ---------------------------------------------------------

    - name: Evaluate filesystem checks
      ansible.builtin.set_fact:
        root_check_passed: "{{ root_usage.stdout | int <= root_threshold }}"
        var_check_passed: "{{ var_usage.stdout | int <= var_threshold }}"
        boot_check_passed: "{{ boot_usage.stdout | int <= boot_threshold }}"

    - name: Display filesystem checks
      ansible.builtin.debug:
        msg:
          - "Root: {{ root_usage.stdout }}% - {{ 'PASS' if root_check_passed else 'FAIL' }}"
          - "/var: {{ var_usage.stdout }}% - {{ 'PASS' if var_check_passed else 'FAIL' }}"
          - "/boot: {{ boot_usage.stdout }}% - {{ 'PASS' if boot_check_passed else 'FAIL' }}"


    # ---------------------------------------------------------
    # 5. Check Failed Systemd Services
    # ---------------------------------------------------------

    - name: Check failed systemd services
      ansible.builtin.shell: |
        systemctl --failed --no-legend
      register: failed_services
      changed_when: false
      failed_when: false

    - name: Determine service status
      ansible.builtin.set_fact:
        services_check_passed: "{{ failed_services.stdout | trim == '' }}"

    - name: Display service check
      ansible.builtin.debug:
        msg: >-
          Failed Services:
          {{ 'None - PASS' if services_check_passed
             else 'WARNING - Failed services detected' }}


    # ---------------------------------------------------------
    # 6. Check DNF / Available Updates
    # ---------------------------------------------------------

    - name: Check available updates
      ansible.builtin.dnf:
        list: updates
        update_cache: true
      register: available_updates
      when: ansible_facts.os_family == "RedHat"

    - name: Count available updates
      ansible.builtin.set_fact:
        update_count: "{{ available_updates.results | default([]) | length }}"
      when: ansible_facts.os_family == "RedHat"

    - name: Display update information
      ansible.builtin.debug:
        msg: "Available updates: {{ update_count | default(0) }}"


    # ---------------------------------------------------------
    #
```
