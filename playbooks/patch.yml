---
- name: Linux Patch Management - Patch
  hosts: web
  become: true
  gather_facts: true

  vars:
    root_threshold: 90
    var_threshold: 90
    boot_threshold: 80

  tasks:

    - name: Check operating system
      ansible.builtin.set_fact:
        os_check_passed: "{{ ansible_distribution == 'RedHat' }}"

    - name: Check root filesystem usage
      ansible.builtin.shell: |
        df -P / | awk 'NR==2 {gsub("%","",$5); print $5}'
      register: root_usage
      changed_when: false

    - name: Check /var filesystem usage
      ansible.builtin.shell: |
        df -P /var | awk 'NR==2 {gsub("%","",$5); print $5}'
      register: var_usage
      changed_when: false

    - name: Check /boot filesystem usage
      ansible.builtin.shell: |
        df -P /boot | awk 'NR==2 {gsub("%","",$5); print $5}'
      register: boot_usage
      changed_when: false

    - name: Evaluate filesystem checks
      ansible.builtin.set_fact:
        root_check_passed: "{{ root_usage.stdout | int <= root_threshold }}"
        var_check_passed: "{{ var_usage.stdout | int <= var_threshold }}"
        boot_check_passed: "{{ boot_usage.stdout | int <= boot_threshold }}"

    - name: Check failed systemd services
      ansible.builtin.shell: |
        systemctl --failed --no-legend
      register: failed_services
      changed_when: false
      failed_when: false

    - name: Determine service status
      ansible.builtin.set_fact:
        services_check_passed: "{{ failed_services.stdout | trim == '' }}"

    - name: Check available updates
      ansible.builtin.dnf:
        list: updates
        update_cache: true
      register: available_updates

    - name: Determine patch eligibility
      ansible.builtin.set_fact:
        patch_eligible: >-
          {{
            os_check_passed
            and root_check_passed
            and var_check_passed
            and boot_check_passed
            and services_check_passed
          }}

    - name: Display patch decision
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "PATCH DECISION"
          - "=========================================="
          - "Server: {{ inventory_hostname }}"
          - "Hostname: {{ ansible_hostname }}"
          - "OS Check: {{ 'PASS' if os_check_passed else 'FAIL' }}"
          - "Root: {{ root_usage.stdout }}% - {{ 'PASS' if root_check_passed else 'FAIL' }}"
          - "/var: {{ var_usage.stdout }}% - {{ 'PASS' if var_check_passed else 'FAIL' }}"
          - "/boot: {{ boot_usage.stdout }}% - {{ 'PASS' if boot_check_passed else 'FAIL' }}"
          - "Failed Services: {{ 'NO' if services_check_passed else 'YES' }}"
          - "Available Updates: {{ available_updates.results | length }}"
          - "Patch Eligible: {{ patch_eligible }}"
          - "=========================================="

    - name: Skip ineligible server
      ansible.builtin.debug:
        msg: "SKIPPED - Server did not pass patch eligibility checks."
      when: not patch_eligible

    - name: Apply all available updates
      ansible.builtin.dnf:
        name: "*"
        state: latest
      register: patch_result
      when:
        - patch_eligible
        - available_updates.results | length > 0

    - name: No updates available
      ansible.builtin.debug:
        msg: "No updates available. Nothing to patch."
      when:
        - patch_eligible
        - available_updates.results | length == 0

    - name: Display patch result
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "PATCH RESULT"
          - "=========================================="
          - "Server: {{ inventory_hostname }}"
          - "Patch Eligible: {{ patch_eligible }}"
          - "Updates Available Before Patch: {{ available_updates.results | length }}"
          - "Packages Changed: {{ patch_result.changed | default(false) }}"
          - "=========================================="
      when: patch_eligible
