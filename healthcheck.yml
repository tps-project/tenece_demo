---
- name: Run health check and save report on the web server
  hosts: web
  become: yes
  become_method: sudo
  gather_facts: no

  vars:
    report_dir: "/var/log/ansible-health-reports"
    report_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
    report_file: "{{ report_dir }}/health_report_{{ inventory_hostname }}_{{ report_timestamp }}.txt"

  tasks:
    - name: Create health-report directory
      file:
        path: "{{ report_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Run health check
      shell: |
        #!/bin/bash
        set -o pipefail

        cpu=$(top -bn1 | awk -F',' '/Cpu\(s\)/ {gsub(/[^0-9.]/, "", $4); print 100 - $4 "%"}')
        mem=$(free -m | awk 'NR==2 {printf "%.2f%%", $3 * 100 / $2}')
        disk=$(df -h / | awk 'NR==2 {print $5}')
        fs=$(lsblk -o NAME,SIZE,MOUNTPOINT)
        net=$(awk '/:/ && $1 !~ /lo:/ {gsub(/:/, "", $1); print $1 ": RX=" $2 " bytes, TX=" $10 " bytes"}' /proc/net/dev)

        echo "UNIX HEALTH REPORT"
        echo "=================="
        echo "Host           : $(hostname)"
        echo "Generated      : $(date)"
        echo "CPU Usage      : $cpu"
        echo "Memory Usage   : $mem"
        echo "Disk Usage     : $disk"
        echo
        echo "Filesystem Info:"
        echo "$fs"
        echo
        echo "Network Stats:"
        echo "$net"
      args:
        executable: /bin/bash
      register: health_output
      changed_when: false

    - name: Save health report on the server
      copy:
        dest: "{{ report_file }}"
        content: "{{ health_output.stdout }}\n"
        owner: root
        group: root
        mode: "0644"

    - name: Show saved report location
      debug:
        msg: "Health report saved on {{ inventory_hostname }} at {{ report_file }}"
