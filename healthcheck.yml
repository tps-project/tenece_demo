---
- name: Run health check, save report, and email report
  hosts: web
  become: true
  become_method: sudo
  gather_facts: false

  vars:
    report_dir: "/var/log/ansible-health-reports"

    # dont forget to change
    smtp_server: "smtp.office365.com"
    smtp_port: 587
    smtp_username: "ola.oyetunde@tenece.com"
    smtp_password: "S*287922454113oq"
    sender_email: "ola.oyetunde@tenece.com"

    recipient_emails:
      - "ola.oyetunde@tenece.com"
      - "olasunkanmi.aliu@tenece.com"

    subject: "Unix Health Report - {{ inventory_hostname }}"
    body: >-
      Attached is the latest Unix health report for {{ inventory_hostname }}.
      A copy is also stored at {{ report_file }}.

    email_script_path: "/tmp/send_health_report_email.py"

  tasks:
    # --- 
    - name: Compute report timestamp once
      ansible.builtin.set_fact:
        report_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

    - name: Set report file path
      ansible.builtin.set_fact:
        report_file: "{{ report_dir }}/health_report_{{ inventory_hostname }}_{{ report_timestamp }}.txt"

    - name: Create health-report directory
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Run health check
      ansible.builtin.shell: |
        #!/bin/bash

        cpu=$(top -bn1 | grep "Cpu(s)" | sed "s/.*, *\([0-9.]*\)%* id.*/\1/" | awk '{print 100 - $1 "%"}')
        mem=$(free -m | awk 'NR==2 {printf "%.2f%%", $3*100/$2}')
        disk=$(df -h / | awk 'NR==2 {print $5}')
        fs=$(lsblk -o NAME,SIZE,MOUNTPOINT)
        net=$(awk '/:/ && $1 !~ /lo:/ {gsub(/:/, "", $1); print $1 ": RX=" $2 " bytes, TX=" $10 " bytes"}' /proc/net/dev)

        echo "UNIX HEALTH REPORT"
        echo "=================="
        echo "Host           : $(hostname)"
        echo "Generated      : $(date)"
        echo "CPU Usage      : $cpu"
        echo "Memory Usage   : $mem"
        echo "Disk Usage     : $disk"
        echo
        echo "Filesystem Info:"
        echo "$fs"
        echo
        echo "Network Stats:"
        echo "$net"
      args:
        executable: /bin/bash
      register: health_output
      changed_when: false

    - name: Save health report on the server
      ansible.builtin.copy:
        dest: "{{ report_file }}"
        content: "{{ health_output.stdout }}\n"
        owner: root
        group: root
        mode: "0644"

    - name: Upload Microsoft 365 email script
      ansible.builtin.copy:
        dest: "{{ email_script_path }}"
        owner: root
        group: root
        mode: "0700"
        content: |
          #!/usr/bin/env python3
          import os
          import ssl
          import smtplib
          from email.message import EmailMessage
          from email.utils import formatdate

          def send_email(
              smtp_server, port, username, password, sender,
              recipients, subject, body, attachment_path
          ):
              msg = EmailMessage()
              msg["From"] = sender
              msg["To"] = ", ".join(recipients)
              msg["Date"] = formatdate(localtime=True)
              msg["Subject"] = subject
              msg.set_content(body)

              with open(attachment_path, "rb") as report:
                  file_data = report.read()
                  file_name = os.path.basename(attachment_path)

              msg.add_attachment(
                  file_data,
                  maintype="text",
                  subtype="plain",
                  filename=file_name
              )

              tls_context = ssl.create_default_context()

              with smtplib.SMTP(smtp_server, port, timeout=30) as server:
                  server.ehlo()
                  server.starttls(context=tls_context)
                  server.ehlo()
                  server.login(username, password)
                  server.send_message(msg)

              print("Email sent successfully.")

          if __name__ == "__main__":
              send_email(
                  smtp_server={{ smtp_server | to_json }},
                  port={{ smtp_port }},
                  username={{ smtp_username | to_json }},
                  password={{ smtp_password | to_json }},
                  sender={{ sender_email | to_json }},
                  recipients={{ recipient_emails | to_json }},
                  subject={{ subject | to_json }},
                  body={{ body | to_json }},
                  attachment_path={{ report_file | to_json }}
              )
      no_log: false

    - name: Send health report through Microsoft 365
      ansible.builtin.command:
        cmd: "/usr/bin/python3 {{ email_script_path }}"
      no_log: false
      register: email_result

    - name: Show email command output
      ansible.builtin.debug:
        var: email_result

    - name: Remove temporary email script
      ansible.builtin.file:
        path: "{{ email_script_path }}"
        state: absent

    - name: Show report location
      ansible.builtin.debug:
        msg: "Report saved at {{ report_file }} and email submission completed."
